# SENTINEL Dev mode (Stage 14): PostgreSQL and Redis for `sentinel-start -Mode Dev`.
#
# Started and stopped only by scripts/sentinel-start and sentinel-stop (compose project
# "sentinel-local"); it never touches docker-compose.yml or the staging stack. Ports are
# bound to 127.0.0.1 only. Passwords come from .runtime/secrets/dev.env, generated once by
# the tooling; this file contains none. `docker compose -p sentinel-local down -v` deletes
# the Dev data volume; the tooling never does that for you.
name: sentinel-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud_ai
      POSTGRES_PASSWORD: ${SENTINEL_PG_PASSWORD:?run scripts/sentinel-start (it supplies the password)}
      POSTGRES_DB: fraud_ai_dev
    ports:
      - "127.0.0.1:${SENTINEL_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_ai -d fraud_ai_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", 'exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${SENTINEL_REDIS_PASSWORD:?run scripts/sentinel-start (it supplies the password)}
    ports:
      - "127.0.0.1:${SENTINEL_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
