[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-ai"
version = "0.1.0"
description = "Local fraud-prevention software platform: event store, feature foundation, risk engine and ML interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "click>=8.1",
    # Stage 3 baselines. scikit-learn brings numpy, scipy, joblib and threadpoolctl; the ones
    # imported directly are declared explicitly.
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "joblib>=1.3",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
fraud-ai = "fraud_ai.cli.main:cli"

[tool.setuptools.packages.find]
include = ["fraud_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a PostgreSQL server (set TEST_POSTGRES_URL)",
]
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "error::sqlalchemy.exc.SADeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# S101: asserts are used for invariants/tests. S105: enum members such as
# PASSWORD_RESET are event names, not credentials.
ignore = ["S101", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"fraud_ai/data/synthetic.py" = ["S311"]  # synthetic data uses a seeded PRNG by design
"scripts/**" = ["S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["fraud_ai"]

[[tool.mypy.overrides]]
# These packages ship no type information (no py.typed / stubs).
module = ["alembic.*", "sklearn.*", "joblib.*", "threadpoolctl.*", "scipy.*"]
ignore_missing_imports = true
