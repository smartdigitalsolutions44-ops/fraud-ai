[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-ai"
version = "0.1.0"
description = "Local fraud-prevention software platform: event store, feature foundation, risk engine and ML interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "click>=8.1",
    # Stage 3 baselines. scikit-learn brings numpy, scipy, joblib and threadpoolctl; the ones
    # imported directly are declared explicitly.
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "joblib>=1.3",
    "threadpoolctl>=3.1",
    # Stage 5 neural and autoencoder models (CPU is sufficient; CUDA is optional).
    "torch>=2.2",
    # Stage 9 machine-to-machine service (FastAPI + uvicorn), standard WebAuthn
    # verification (py_webauthn; no custom crypto) and Prometheus metrics.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "webauthn>=2.2",
    "prometheus-client>=0.20",
    "cryptography>=43",
    # Stage 10 shared state (distributed rate limits and replay claims).
    "redis>=5",
    # Security floors for transitive dependencies (pip-audit, see HARDENING.md).
    "idna>=3.15",
    # Transitive via torch; floor for PYSEC-2026-3447 (found by pip-audit in CI).
    "setuptools>=83",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
# Stage 10: the Stripe (test-mode) payment-authentication adapter, official SDK only.
stripe = ["stripe>=10", "urllib3>=2.7.0"]
# Stage 10 security tooling (run in CI; see HARDENING.md).
security = ["pip-audit>=2.7", "bandit>=1.7", "detect-secrets>=1.5", "cyclonedx-bom>=4"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
fraud-ai = "fraud_ai.cli.main:cli"

[tool.setuptools.packages.find]
include = ["fraud_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a PostgreSQL server (set TEST_POSTGRES_URL)",
]
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "error::sqlalchemy.exc.SADeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# S101: asserts are used for invariants/tests. S105: enum members such as
# PASSWORD_RESET are event names, not credentials.
ignore = ["S101", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311"]
"fraud_ai/data/synthetic.py" = ["S311"]  # synthetic data uses a seeded PRNG by design
"scripts/**" = ["S311"]
"migrations/**" = ["E501"]

[tool.bandit]
# Only justified, narrow exclusions (see HARDENING.md, "Static analysis"). Individual
# findings that are false positives are marked inline with `# nosec <id>` and a reason.
exclude_dirs = ["tests", "migrations", "scripts"]
skips = [
    "B101", # assert: used for internal invariants; never for input validation or auth
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["fraud_ai"]

[[tool.mypy.overrides]]
# These packages ship no type information (no py.typed / stubs).
module = ["alembic.*", "sklearn.*", "joblib.*", "threadpoolctl.*", "scipy.*"]
ignore_missing_imports = true
