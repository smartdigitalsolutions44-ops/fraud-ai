# fraud-ai CI (Stages 10-14). Benchmarks are NOT run here (they need a quiet, comparable
# machine); see scripts/check_regression.py and HARDENING.md.
# Artefacts: coverage, SBOM, security summary, container scan and smoke results. Never
# uploaded: .env files, secrets, signing keys or test credentials (the smoke test's keys are
# generated in a temp directory and deleted with it).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly rebuild from a fresh base image and rescan (HARDENING.md §34): Debian fixes for
    # the open base-image CVEs are picked up without waiting for a code change.
    - cron: "23 4 * * 1"

permissions:
  contents: read

# `shell: bash` makes GitHub run every step with `bash -eo pipefail`. The implicit default
# is `bash -e` WITHOUT pipefail, under which `scanner | tee log` passes even when the
# scanner fails (found by the Stage 12 tampered-image check).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,postgres,stripe,anchors]"
      - run: python -m ruff check .
      - run: python -m ruff format --check fraud_ai tests migrations
      - run: python -m mypy

  # Stage 13: the SENTINEL analyst console (sentinel-console/). The Playwright end-to-end
  # test needs the Python service and a freshly built demo world; since Stage 14 it runs in
  # the local-scripts job below, which sets all of that up.
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sentinel-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sentinel-console/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test   # after the build, so the client-bundle secret check runs too

  # Stage 14: the local run tooling (scripts/setup-local, sentinel-start/-status/-stop) on a
  # fresh checkout, for real: Linux runs Demo and Dev mode (Docker PostgreSQL and Redis),
  # Windows runs Demo mode from a checkout path containing spaces. Logs are uploaded on
  # failure (no secrets in them: the tooling redacts API keys and never logs passwords).
  local-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (the shell wrappers)
        run: |
          pip install shellcheck-py==0.10.0.1
          shellcheck -x scripts/setup-local.sh scripts/sentinel-*.sh scripts/_sentinel.sh
      - name: PSScriptAnalyzer (the PowerShell wrappers; warnings and errors fail)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
          $found = Invoke-ScriptAnalyzer -Path scripts -Filter '*.ps1' -Severity Warning,Error `
            -ExcludeRule PSAvoidUsingWriteHost
          $found | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
          if ($found) { exit 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: setup-local (fresh checkout; timed)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          start=$(date +%s)
          ./scripts/setup-local.sh
          echo "SETUP_SECONDS=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          ./scripts/setup-local.sh | tee second-setup.log   # idempotent: nothing reinstalled
          grep -q "backend: already current" second-setup.log
          grep -q "console dependencies: already current" second-setup.log
          grep -q "console production build: already current" second-setup.log
      - name: Demo mode (first start builds the demo world; timed)
        run: |
          start=$(date +%s)
          ./scripts/sentinel-start.sh --mode demo --no-browser
          echo "DEMO_FIRST_START_SECONDS=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          ./scripts/sentinel-status.sh --json | tee status.json
          python - <<'PY'
          import json
          s = json.load(open("status.json"))
          assert s["session"] == "ready" and s["demo_mode"], s
          assert s["api"]["status"] == "ONLINE" and s["console"]["status"] == "ONLINE", s
          assert s["redis"] == "NOT USED", s
          assert all(m["signature_verified"] for m in s["models"]) and len(s["models"]) == 2, s
          PY
          ./scripts/sentinel-stop.sh
          test -z "$(ls -A .runtime/pids)"
          start=$(date +%s)
          ./scripts/sentinel-start.sh --no-browser
          echo "DEMO_WARM_START_SECONDS=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          ./scripts/sentinel-reset-demo.sh --confirm "RESET DEMO"
          ./scripts/sentinel-status.sh
          ./scripts/sentinel-stop.sh
          test -z "$(ls -A .runtime/pids)"
      - name: Dev mode (Docker PostgreSQL 16 and Redis 7)
        run: |
          ./scripts/sentinel-start.sh --mode dev --no-browser
          ./scripts/sentinel-status.sh --json | tee status.json
          python - <<'PY'
          import json
          s = json.load(open("status.json"))
          assert s["session"] == "ready" and not s["demo_mode"], s
          assert s["postgres"] == "ONLINE" and s["redis"] == "ONLINE", s
          assert s["api"]["checks"]["shared_state"] == "ok", s
          PY
          ./scripts/sentinel-stop.sh
          test -z "$(docker compose -p sentinel-local ps -q --status running)"
      - name: Playwright end to end (fresh demo world, real service, WCAG audit, clean console)
        working-directory: sentinel-console
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: StagingLike refuses clearly without Docker
        run: |
          set +e
          DOCKER_HOST=unix:///nonexistent ./scripts/sentinel-start.sh --mode staginglike \
            > refusal.log 2>&1
          code=$?
          set -e
          cat refusal.log
          test "$code" -eq 2 && grep -q "StagingLike needs Docker" refusal.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-scripts-linux-logs
          path: |
            .runtime/logs/
            .runtime/e2e/logs/
            sentinel-console/test-results/
          if-no-files-found: ignore

  local-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: "sentinel test dir"
    env:
      PIP_EXTRA_INDEX_URL: ""   # Windows PyPI wheels of PyTorch are CPU-only already
    steps:
      - uses: actions/checkout@v4
        with:
          path: "sentinel test dir"   # a checkout path containing spaces, on purpose
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: setup-local.ps1 (fresh checkout; timed; then idempotent)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          $t = [Diagnostics.Stopwatch]::StartNew()
          .\scripts\setup-local.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SETUP_SECONDS_WINDOWS=$([int]$t.Elapsed.TotalSeconds)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $second = .\scripts\setup-local.ps1 | Out-String
          Write-Output $second
          if ($second -notmatch 'backend: already current') { throw 'second setup reinstalled the backend' }
      - name: Windows file branches and local tooling tests (native Windows)
        run: |
          .\.venv\Scripts\python.exe -m pip install -q pytest
          .\.venv\Scripts\python.exe -m pytest -q -p no:cacheprovider --noconftest tests/test_windows_files.py tests/test_localrun.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: sentinel-start.ps1 -Mode Demo, status, stop (timed)
        run: |
          $t = [Diagnostics.Stopwatch]::StartNew()
          .\scripts\sentinel-start.ps1 -Mode Demo -NoBrowser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DEMO_FIRST_START_SECONDS_WINDOWS=$([int]$t.Elapsed.TotalSeconds)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          .\scripts\sentinel-status.ps1
          # Windows 11's default shell is Windows PowerShell 5.1: the wrappers must work there too
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\sentinel-status.ps1
          if ($LASTEXITCODE -ne 0) { throw "sentinel-status.ps1 failed under Windows PowerShell 5.1" }
          $status = .\scripts\sentinel-status.ps1 -Json | Out-String | ConvertFrom-Json
          if ($status.session -ne 'ready' -or $status.api.status -ne 'ONLINE' -or $status.console.status -ne 'ONLINE') {
            throw "not ready: $($status | ConvertTo-Json -Depth 5)"
          }
          if ($status.redis -ne 'NOT USED') { throw 'Redis must be NOT USED in Demo mode' }
          $t = [Diagnostics.Stopwatch]::StartNew()
          .\scripts\sentinel-stop.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "STOP_SECONDS_WINDOWS=$([int]$t.Elapsed.TotalSeconds)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if (Get-ChildItem .runtime\pids) { throw 'PID records left behind' }
          foreach ($port in 8080, 3000) {
            if (Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue) { throw "port $port still in use" }
          }
          $t = [Diagnostics.Stopwatch]::StartNew()
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\sentinel-start.ps1 -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "sentinel-start.ps1 failed under Windows PowerShell 5.1" }
          "DEMO_WARM_START_SECONDS_WINDOWS=$([int]$t.Elapsed.TotalSeconds)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\sentinel-stop.ps1
          if ($LASTEXITCODE -ne 0) { throw "sentinel-stop.ps1 failed under Windows PowerShell 5.1" }
          if (Get-ChildItem .runtime\pids) { throw 'PID records left behind' }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-scripts-windows-logs
          path: "sentinel test dir/.runtime/logs/"
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fraud_ai
          POSTGRES_PASSWORD: fraud_ai_dev # CI-only throwaway database
          POSTGRES_DB: fraud_ai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fraud_ai -d fraud_ai_test" --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System packages (redis-server for the shared-state tests, pg tools)
        run: sudo apt-get update && sudo apt-get install -y redis-server postgresql-client
      - run: pip install -e ".[dev,postgres,stripe,anchors,local]"
      - name: Staging-profile database role (non-default password, for the staging E2E)
        run: |
          STAGING_PW="$(python -c 'import secrets; print(secrets.token_hex(16))')"
          PGPASSWORD=fraud_ai_dev psql -h localhost -U fraud_ai -d fraud_ai_test \
            -c "CREATE ROLE fraud_ai_staging LOGIN CREATEDB PASSWORD '${STAGING_PW}'" \
            -c "CREATE DATABASE fraud_ai_staging OWNER fraud_ai_staging"
          echo "::add-mask::${STAGING_PW}"
          echo "TEST_STAGING_POSTGRES_URL=postgresql+psycopg://fraud_ai_staging:${STAGING_PW}@localhost:5432/fraud_ai_staging" >> "$GITHUB_ENV"
      - name: Tests (SQLite + PostgreSQL + Redis + least-privilege roles), coverage gate 95%
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://fraud_ai:fraud_ai_dev@localhost:5432/fraud_ai_test
          # The service container's user is a superuser: it creates the Stage 11 roles.
          TEST_PG_ADMIN_URL: postgresql+psycopg://fraud_ai:fraud_ai_dev@localhost:5432/postgres
        run: |
          python -m pytest -q --cov=fraud_ai --cov-report=term --cov-report=xml:coverage.xml \
            --cov-report=html:coverage-html --cov-fail-under=95
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            coverage-html/
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[postgres,stripe,anchors,security]"
      - name: Dependency audit (known vulnerabilities; see security/pip-audit-ignore.txt)
        run: python scripts/security_checks.py pip-audit | tee security-pip-audit.txt
      - name: Static analysis (bandit, config in pyproject.toml)
        if: always()
        run: python scripts/security_checks.py bandit | tee security-bandit.txt
      - name: Secret scan (detect-secrets against the reviewed baseline)
        if: always()
        run: python scripts/security_checks.py secrets | tee security-detect-secrets.txt
      - name: Secret scan of the full git history (gitleaks, config .gitleaks.toml)
        if: always()
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact -c .gitleaks.toml . 2>&1 | tee security-gitleaks.txt
          exit "${PIPESTATUS[0]}"
      - name: SBOM (CycloneDX)
        if: always()
        run: python scripts/security_checks.py sbom --output sbom.cdx.json
      - name: Summary
        if: always()
        run: |
          {
            echo "## Security checks"
            for f in security-*.txt; do echo "### ${f}"; echo '```'; tail -5 "$f"; echo '```'; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-summary
          path: |
            security-*.txt
            sbom.cdx.json
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [lint]
    services:
      registry: # a private, run-local registry: cosign signs by digest in a registry
        image: registry:2
        ports: ["5000:5000"]
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fraud_ai
          POSTGRES_PASSWORD: fraud_ai_dev # CI-only throwaway database
          POSTGRES_DB: fraud_ai_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fraud_ai -d fraud_ai_smoke" --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the release image (CPU PyTorch)
        run: DOCKER_BUILDKIT=1 docker build -t fraud-ai:ci .
      - name: Build the scikit-learn-only variant (size comparison only; never released)
        run: DOCKER_BUILDKIT=1 docker build --build-arg WITH_TORCH=0 -t fraud-ai:ci-notorch .
      - name: Image checks (non-root, no secrets/.git/databases/keys, read-only start)
        run: bash scripts/container_checks.sh fraud-ai:ci
      - name: Smoke test (migrate, GRU, unsigned models refused, signed models load)
        run: |
          bash scripts/container_smoke.sh fraud-ai:ci \
            postgresql+psycopg://fraud_ai:fraud_ai_dev@127.0.0.1:5432/fraud_ai_smoke container-results
      - name: Image sizes and largest packages
        run: |
          mkdir -p container-results
          {
            for image in fraud-ai:ci fraud-ai:ci-notorch; do
              echo "${image} $(docker image inspect --format '{{.Size}}' "$image") bytes"
            done
            docker run --rm --entrypoint sh fraud-ai:ci -c \
              'du -sm /usr/local/lib/python3.11/site-packages/* | sort -rn | head -15'
            # Stage 12 size review: what inside PyTorch could be pruned without changing
            # what the service runs (headers, static libraries, test fixtures, cmake files).
            docker run --rm --entrypoint sh fraud-ai:ci -c \
              'cd /usr/local/lib/python3.11/site-packages/torch && du -sm lib include bin share \
                 testing _inductor utils distributed 2>/dev/null | sort -rn; \
               echo "static .a: $(find . -name "*.a" -exec du -cm {} + | tail -1)"; \
               echo "largest libs:"; ls -S lib | head -5 | while read f; do du -sm "lib/$f"; done'
          } | tee container-results/sizes.txt
      - name: Vulnerability scan (Trivy 0.58.1; HIGH/CRITICAL are reported, never hidden)
        run: |
          for image in fraud-ai:ci fraud-ai:ci-notorch; do
            tag="${image//:/_}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/container-results:/out" aquasec/trivy:0.58.1 image --scanners vuln \
              --format json -o "/out/trivy-${tag}.json" "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
              image --scanners vuln --severity HIGH,CRITICAL --format table "$image" \
              | tee "container-results/trivy-${tag}.txt"
          done
      - name: Install cosign (checksum-verified)
        run: |
          curl -sSL -o cosign https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          curl -sSL -o cosign_checksums.txt https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign_checksums.txt
          grep " cosign-linux-amd64$" cosign_checksums.txt | awk '{print $1"  cosign"}' | sha256sum -c -
          sudo install -m 0755 cosign /usr/local/bin/cosign && rm cosign cosign_checksums.txt
      - name: Sign the image, attach SLSA provenance and SBOM (dedicated image key)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # A repository secret COSIGN_PRIVATE_KEY (the dedicated image key) gives persistent
          # trust. Without it an EPHEMERAL key is generated for this run: it demonstrates the
          # mechanism only, and is deleted afterwards (its public key is kept as evidence).
          keydir="$(mktemp -d)"
          if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
            printf '%s' "$COSIGN_PRIVATE_KEY" > "$keydir/cosign.key"
            cosign public-key --key "$keydir/cosign.key" > "$keydir/cosign.pub"
            echo "image key: repository secret" | tee container-results/image-key.txt
          else
            (cd "$keydir" && COSIGN_PASSWORD= cosign generate-key-pair >/dev/null)
            export COSIGN_PASSWORD=
            echo "image key: EPHEMERAL (mechanism demonstration only)" | tee container-results/image-key.txt
          fi
          GIT_REF="$GITHUB_REF" bash scripts/image_sign.sh fraud-ai:ci localhost:5000/fraud-ai \
            "$keydir/cosign.key" "$keydir/cosign.pub" container-results/image
          cp "$keydir/cosign.pub" container-results/image/cosign.pub
          rm -rf "$keydir"
      - name: Verify image signature, digest, provenance and SBOM; a tampered image must fail
        run: |
          # Explicit (as well as the workflow default): without pipefail, `verify | tee`
          # returns tee's status, so a refused tampered image would look accepted.
          set -o pipefail
          verify() {
            docker run --rm --network host --read-only --tmpfs /tmp -e HOME=/tmp \
              -v /usr/local/bin/cosign:/usr/local/bin/cosign:ro \
              -v "$PWD/container-results/image:/r:ro" fraud-ai:ci \
              release verify-image /r/image-evidence.json --key /r/cosign.pub --commit "$GITHUB_SHA" "$@"
          }
          verify | tee container-results/image-verify.txt
          printf 'FROM fraud-ai:ci\nLABEL tampered="yes"\n' | docker build -q -t fraud-ai:tampered - >/dev/null
          docker tag fraud-ai:tampered localhost:5000/fraud-ai:tampered
          docker push -q localhost:5000/fraud-ai:tampered >/dev/null
          tampered="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            localhost:5000/fraud-ai:tampered | grep -m1 '^localhost:5000/fraud-ai@')"
          if verify --image "$tampered" | tee container-results/image-verify-tampered.txt; then
            echo "FAIL: a tampered image verified" >&2; exit 1
          fi
          echo "tampered image refused (expected)" | tee -a container-results/image-verify-tampered.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## Container"
            echo '```'; cat container-results/sizes.txt 2>/dev/null || true; echo '```'
            echo '```'; cat container-results/container-smoke.json 2>/dev/null || true; echo '```'
            echo '```'; cat container-results/image-key.txt container-results/image-verify.txt \
              container-results/image-verify-tampered.txt 2>/dev/null || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-scan
          path: container-results/
          if-no-files-found: ignore
